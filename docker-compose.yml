services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://apex:${POSTGRES_PASSWORD}@db:5432/apex
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.init_db && gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - app.main:app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  jenkins:
    build: ./jenkins
    user: "0:0"
    profiles: ["ci"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  postgres_data:
  jenkins_home:
